    <title>Skyline Lyon — Option C (parallax multicouche)</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0ebe2;
        }

        .spacer {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        .spacer h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3rem;
            font-weight: 400;
            color: #2c2418;
            text-align: center;
        }
        .spacer p { text-align: center; color: #888; font-size: 0.9rem; margin-top: 15px; }

        .skyline-section {
            position: relative;
            width: 100%;
            height: 250px;
            overflow: hidden;
            background: linear-gradient(180deg, #f0ebe2 0%, #e8e0d4 100%);
        }

        .sky-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: none;
        }

        .sky-layer svg {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: auto;
        }

        /* 3 layers at different depths */
        .layer-back { opacity: 0.05; }
        .layer-mid  { opacity: 0.1; }
        .layer-front { opacity: 0.18; }

        /* Lyon label */
        .lyon-label {
            position: absolute;
            bottom: 20px;
            right: 60px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.9rem;
            font-style: italic;
            color: #72785f;
            opacity: 0;
            transition: opacity 0.8s;
            letter-spacing: 2px;
        }

        .skyline-section.active .lyon-label { opacity: 0.5; }

        /* Horizontal line */
        .sky-baseline {
            position: absolute;
            bottom: 50px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, #72785f 20%, #72785f 80%, transparent 100%);
            opacity: 0;
            transition: opacity 1s 0.5s;
        }

        .skyline-section.active .sky-baseline { opacity: 0.12; }

        .next-section {
            background: #1a1a1a;
            min-height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .next-section p {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            color: #555;
        }

        .label {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: #72785f;
            color: #fff;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.7rem;
            letter-spacing: 2px;
            z-index: 100;
        }
    </style>
</head>

    <div class="next-section">
        <p>— Section suivante —</p>
    </div>

    <script>
        const section = document.getElementById('skylineSection');
        const layerBack = document.getElementById('layerBack');
        const layerMid = document.getElementById('layerMid');
        const layerFront = document.getElementById('layerFront');

        window.addEventListener('scroll', () => {
            const rect = section.getBoundingClientRect();
            const windowH = window.innerHeight;
            const start = windowH;
            const end = -rect.height;
            const progress = Math.max(0, Math.min(1, (start - rect.top) / (start - end)));

            // Each layer moves at different speeds (parallax)
            const backOffset = (1 - progress) * 80;
            const midOffset = (1 - progress) * 50;
            const frontOffset = (1 - progress) * 25;

            layerBack.style.transform = `translateX(${backOffset}px)`;
            layerMid.style.transform = `translateX(${midOffset * 0.6}px) translateY(${(1-progress) * 15}px)`;
            layerFront.style.transform = `translateX(${-frontOffset * 0.3}px)`;

            // Fade in layers progressively
            layerBack.style.opacity = Math.min(0.06, progress * 0.12);
            layerMid.style.opacity = Math.min(0.12, Math.max(0, (progress - 0.15)) * 0.2);
            layerFront.style.opacity = Math.min(0.2, Math.max(0, (progress - 0.3)) * 0.35);

            if (progress > 0.5) {
                section.classList.add('active');
            } else {
                section.classList.remove('active');
            }
        });
    </script>
