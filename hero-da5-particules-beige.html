<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero — Particules Beige WebGL</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #ede8df;
            color: #1a1a2e;
            overflow-x: hidden;
        }

        .hero {
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 40px;
            overflow: hidden;
            background: linear-gradient(180deg, #ede8df 0%, #e3dbd0 40%, #d9cfc2 70%, #ede8df 100%);
        }

        canvas#glcanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .grain {
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 3;
        }

        .header {
            position: absolute;
            top: 0; left: 0; right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 30px 60px;
            z-index: 10;
        }

        .logo {
            font-family: 'DM Serif Display', serif;
            font-size: 1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #2c2418;
        }

        .nav { display: flex; gap: 25px; }
        .nav a {
            font-size: 0.75rem;
            color: #2c2418;
            text-decoration: none;
            font-weight: 400;
            opacity: 0.5;
            transition: opacity 0.3s;
        }
        .nav a:hover { opacity: 1; }

        .hero-content { position: relative; z-index: 5; }

        .hero-eyebrow {
            font-size: 0.95rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #8b7040;
            margin-bottom: 35px;
            font-weight: 500;
        }

        .hero-title {
            font-family: 'DM Serif Display', serif;
            font-size: 5.5rem;
            font-weight: 400;
            line-height: 1;
            margin-bottom: 25px;
            color: #2c2418;
        }

        .hero-title .italic { font-style: italic; }

        .hero-divider {
            width: 50px;
            height: 1px;
            background: #b89a5a;
            margin: 30px auto;
        }

        .hero-description {
            font-size: 1.15rem;
            font-weight: 300;
            line-height: 1.8;
            color: #5a4a3a;
            max-width: 550px;
            margin: 0 auto;
        }

        .hero-description strong {
            font-family: 'DM Serif Display', serif;
            font-weight: 400;
            font-style: italic;
            color: #2c2418;
            font-size: 1.3rem;
        }

        .scroll-indicator {
            position: absolute;
            bottom: 40px;
            right: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .scroll-text {
            font-size: 0.65rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #8b7040;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
        }

        .scroll-line {
            width: 1px;
            height: 60px;
            background: #c4a35a33;
            position: relative;
            overflow: hidden;
        }

        .scroll-line::after {
            content: '';
            position: absolute;
            top: -100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: #b89a5a;
            animation: scrollDown 2s ease-in-out infinite;
        }

        @keyframes scrollDown {
            0% { top: -100%; }
            50% { top: 0; }
            100% { top: 100%; }
        }

        .next-section {
            min-height: 50vh;
            background: #fdfcfa;
            padding: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .next-section p {
            font-family: 'DM Serif Display', serif;
            font-size: 1.5rem;
            color: #999;
        }
    </style>
</head>
<body>
    <section class="hero" id="heroSection">
        <canvas id="glcanvas"></canvas>
        <div class="grain"></div>

        <header class="header">
            <div class="logo">S. Mostfa</div>
            <nav class="nav">
                <a href="#">Domaines</a>
                <a href="#">Cabinet</a>
                <a href="#">Honoraires</a>
                <a href="#">Contact</a>
            </nav>
        </header>

        <div class="hero-content">
            <p class="hero-eyebrow">Avocate au Barreau de Lyon</p>
            <h1 class="hero-title">
                Sarah <span class="italic">Mostfa.</span>
            </h1>
            <div class="hero-divider"></div>
            <p class="hero-description">
                Assure la défense de vos intérêts devant les juridictions <strong>civiles</strong> et <strong>commerciales</strong>.
            </p>
        </div>

        <div class="scroll-indicator">
            <span class="scroll-text">Défiler</span>
            <div class="scroll-line"></div>
        </div>
    </section>

    <section class="next-section">
        <p>— Section suivante : Domaines d'intervention —</p>
    </section>

    <script>
    (function() {
        const canvas = document.getElementById('glcanvas');
        const gl = canvas.getContext('webgl', { alpha: true, premultipliedAlpha: false });
        if (!gl) return;

        const vertSrc = `
            attribute vec2 a_position;
            uniform vec2 u_resolution;
            attribute vec2 a_color;
            varying vec2 v_color;
            void main(){
                gl_Position = vec4(vec2(1, -1) * ((a_position / u_resolution) * 2.0 - 1.0), 0, 1);
                v_color = a_color;
            }
        `;

        const fragSrc = `
            precision mediump float;
            varying vec2 v_color;
            uniform float u_tick;

            void main(){
                float t = v_color.x + u_tick;
                t = fract(t);

                // Beige palette: warm sand → golden → cream
                vec3 c1 = vec3(0.78, 0.70, 0.58); // warm sand
                vec3 c2 = vec3(0.72, 0.60, 0.38); // golden
                vec3 c3 = vec3(0.85, 0.78, 0.65); // cream
                vec3 c4 = vec3(0.65, 0.52, 0.35); // amber
                vec3 c5 = vec3(0.90, 0.85, 0.75); // light beige

                vec3 color;
                if (t < 0.25) {
                    color = mix(c1, c2, t / 0.25);
                } else if (t < 0.5) {
                    color = mix(c2, c3, (t - 0.25) / 0.25);
                } else if (t < 0.75) {
                    color = mix(c3, c4, (t - 0.5) / 0.25);
                } else {
                    color = mix(c4, c5, (t - 0.75) / 0.25);
                }

                float alpha = v_color.y * 0.7;
                gl_FragColor = vec4(color * alpha, alpha);
            }
        `;

        function createShader(type, source) {
            const s = gl.createShader(type);
            gl.shaderSource(s, source);
            gl.compileShader(s);
            return s;
        }

        const prog = gl.createProgram();
        gl.attachShader(prog, createShader(gl.VERTEX_SHADER, vertSrc));
        gl.attachShader(prog, createShader(gl.FRAGMENT_SHADER, fragSrc));
        gl.linkProgram(prog);

        const aPos = gl.getAttribLocation(prog, 'a_position');
        const aCol = gl.getAttribLocation(prog, 'a_color');
        const uRes = gl.getUniformLocation(prog, 'u_resolution');
        const uTick = gl.getUniformLocation(prog, 'u_tick');
        const posBuf = gl.createBuffer();
        const colBuf = gl.createBuffer();

        let w, h, cx, cy, tick = 0;
        let triangles = [], colors = [];
        const particles = [];
        const MAX = 800;
        const SIZE_MIN = 2, SIZE_MAX = 6, SPEED = 1.5;

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            cx = w / 2;
            cy = h / 2;
            gl.viewport(0, 0, w, h);
            gl.useProgram(prog);
            gl.uniform2f(uRes, w, h);
        }

        function getCircleTris(x, y, r) {
            const t = [];
            const seg = 6;
            const inc = Math.PI * 2 / seg;
            let px = x + r, py = y;
            for (let i = inc; i <= Math.PI * 2 + inc; i += inc) {
                const nx = x + r * Math.cos(i);
                const ny = y + r * Math.sin(i);
                t.push(x, y, px, py, nx, ny);
                px = nx; py = ny;
            }
            return t;
        }

        function Particle() {
            this.size = SIZE_MIN + (SIZE_MAX - SIZE_MIN) * Math.random();
            this.x = cx;
            this.y = cy;
            this.vx = (Math.random() - 0.5) * 2 * SPEED;
            this.vy = -1.5 - SPEED * Math.random();
            this.time = 1;
        }

        Particle.prototype.step = function() {
            this.vx *= 0.996;
            this.vy += 0.03;
            this.x += this.vx;
            this.y += this.vy;
            this.time *= 0.993;

            const tris = getCircleTris(this.x, this.y, this.size * this.time);
            const hue = (this.vy / 8 + this.vx / 12);
            for (let i = 0; i < tris.length; i += 2) {
                triangles.push(tris[i], tris[i + 1]);
                colors.push(hue, this.time);
            }

            if (this.y - this.size > h || this.time < 0.02) {
                this.x = cx;
                this.y = cy;
                this.vx = (Math.random() - 0.5) * 2 * SPEED;
                this.vy = -1.5 - SPEED * Math.random();
                this.time = 1;
                this.size = SIZE_MIN + (SIZE_MAX - SIZE_MIN) * Math.random();
            }
        };

        gl.useProgram(prog);
        gl.enableVertexAttribArray(aPos);
        gl.enableVertexAttribArray(aCol);
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
        gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
        gl.bindBuffer(gl.ARRAY_BUFFER, colBuf);
        gl.vertexAttribPointer(aCol, 2, gl.FLOAT, false, 0, 0);

        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.clearColor(0, 0, 0, 0);

        resize();

        function animate() {
            gl.clear(gl.COLOR_BUFFER_BIT);
            triangles = [];
            colors = [];
            tick++;

            if (particles.length < MAX) {
                particles.push(new Particle(), new Particle());
            }

            particles.forEach(p => p.step());

            gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(triangles), gl.DYNAMIC_DRAW);
            gl.bindBuffer(gl.ARRAY_BUFFER, colBuf);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(colors), gl.DYNAMIC_DRAW);
            gl.uniform1f(uTick, tick / 200);
            gl.drawArrays(gl.TRIANGLES, 0, triangles.length / 2);

            requestAnimationFrame(animate);
        }

        window.addEventListener('mousemove', e => { cx = e.clientX; cy = e.clientY; });
        window.addEventListener('touchmove', e => { cx = e.touches[0].clientX; cy = e.touches[0].clientY; });
        window.addEventListener('resize', resize);
        animate();
    })();
    </script>
</body>
</html>
