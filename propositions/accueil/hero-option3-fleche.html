<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero - Option 3 (Flèche minimaliste + reveal)</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #ede8df;
            color: #1a1a2e;
            overflow-x: hidden;
        }

        .hero {
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 40px;
        }

        .hero-bg {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 50% 100%, rgba(196, 163, 90, 0.1) 0%, transparent 60%);
        }

        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 30px 60px;
            z-index: 10;
        }

        .logo {
            font-family: 'DM Serif Display', serif;
            font-size: 1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .nav { display: flex; gap: 25px; }
        .nav a {
            font-size: 0.75rem;
            color: #1a1a2e;
            text-decoration: none;
            font-weight: 300;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .nav a:hover { opacity: 1; }

        .hero-content {
            position: relative;
            z-index: 5;
        }

        .hero-eyebrow {
            font-size: 0.7rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #999;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .hero-title {
            font-family: 'DM Serif Display', serif;
            font-size: 5.5rem;
            font-weight: 400;
            line-height: 1;
            margin-bottom: 30px;
        }

        .hero-title .italic {
            font-style: italic;
        }

        .hero-divider {
            width: 50px;
            height: 1px;
            background: #c4a35a;
            margin: 30px auto;
        }

        .hero-description {
            font-size: 1.15rem;
            font-weight: 300;
            line-height: 1.8;
            color: #555;
            max-width: 550px;
            margin: 0 auto;
        }

        .hero-description strong {
            font-family: 'DM Serif Display', serif;
            font-weight: 400;
            font-style: italic;
            color: #1a1a2e;
            font-size: 1.3rem;
        }

        /* ===== SCROLL INDICATOR - Option 3: Flèche fine avec texte qui apparaît au hover ===== */
        .scroll-arrow {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            z-index: 10;
            text-decoration: none;
            color: #1a1a2e;
        }

        .scroll-arrow-label {
            font-size: 0.65rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #aaa;
            opacity: 0;
            transform: translateY(5px);
            transition: all 0.3s;
        }

        .scroll-arrow:hover .scroll-arrow-label {
            opacity: 1;
            transform: translateY(0);
        }

        .scroll-arrow-icon {
            width: 24px;
            height: 24px;
            border-right: 1.5px solid #1a1a2e;
            border-bottom: 1.5px solid #1a1a2e;
            transform: rotate(45deg);
            animation: arrowPulse 2s ease-in-out infinite;
        }

        @keyframes arrowPulse {
            0%, 100% { opacity: 1; transform: rotate(45deg) translate(0, 0); }
            50% { opacity: 0.5; transform: rotate(45deg) translate(3px, 3px); }
        }

        .next-section {
            min-height: 50vh;
            background: #fdfcfa;
            padding: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .next-section p {
            font-family: 'DM Serif Display', serif;
            font-size: 1.5rem;
            color: #999;
        }
    </style>
</head>
<body>
    <section class="hero">
        <div class="hero-bg"></div>

        <header class="header">
            <div class="logo">S. Mostfa</div>
            <nav class="nav">
                <a href="#">Domaines</a>
                <a href="#">Cabinet</a>
                <a href="#">Honoraires</a>
                <a href="#">Contact</a>
            </nav>
        </header>

        <div class="hero-content">
            <p class="hero-eyebrow">Avocate au Barreau de Lyon</p>
            <h1 class="hero-title">
                Sarah <span class="italic">Mostfa.</span>
            </h1>
            <div class="hero-divider"></div>
            <p class="hero-description">
                Assure la défense de vos intérêts devant les juridictions <strong>civiles</strong> et <strong>commerciales</strong>.
            </p>
        </div>

        <!-- Scroll indicator: chevron fin avec label au hover -->
        <a href="#next" class="scroll-arrow">
            <span class="scroll-arrow-label">Explorer</span>
            <div class="scroll-arrow-icon"></div>
        </a>
    </section>

    <section class="next-section" id="next">
        <p>— Section suivante : Domaines d'intervention —</p>
    </section>
</body>
</html>
