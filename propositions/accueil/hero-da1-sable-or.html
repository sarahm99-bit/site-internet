<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DA 1 — Sable & Or</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #e8e0d4;
            color: #1a1a2e;
            overflow-x: hidden;
        }

        .hero {
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 40px;
            overflow: hidden;
        }

        /* Interactive canvas background */
        canvas#bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        /* Grain overlay */
        .grain {
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
        }

        .header {
            position: absolute;
            top: 0; left: 0; right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 30px 60px;
            z-index: 10;
        }

        .logo {
            font-family: 'DM Serif Display', serif;
            font-size: 1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #2c2418;
        }

        .nav { display: flex; gap: 25px; }
        .nav a {
            font-size: 0.75rem;
            color: #2c2418;
            text-decoration: none;
            font-weight: 400;
            opacity: 0.5;
            transition: opacity 0.3s;
        }
        .nav a:hover { opacity: 1; }

        .hero-content {
            position: relative;
            z-index: 5;
        }

        .hero-eyebrow {
            font-size: 0.95rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #8b6914;
            margin-bottom: 35px;
            font-weight: 500;
        }

        .hero-title {
            font-family: 'DM Serif Display', serif;
            font-size: 5.5rem;
            font-weight: 400;
            line-height: 1;
            margin-bottom: 25px;
            color: #2c2418;
        }

        .hero-title .italic { font-style: italic; }

        .hero-divider {
            width: 50px;
            height: 1px;
            background: #c4a35a;
            margin: 30px auto;
        }

        .hero-description {
            font-size: 1.15rem;
            font-weight: 300;
            line-height: 1.8;
            color: #5a4a3a;
            max-width: 550px;
            margin: 0 auto;
        }

        .hero-description strong {
            font-family: 'DM Serif Display', serif;
            font-weight: 400;
            font-style: italic;
            color: #2c2418;
            font-size: 1.3rem;
        }

        /* Scroll indicator (option 1 style) */
        .scroll-indicator {
            position: absolute;
            bottom: 40px;
            right: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .scroll-text {
            font-size: 0.65rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #8b6914;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
        }

        .scroll-line {
            width: 1px;
            height: 60px;
            background: #c4a35a33;
            position: relative;
            overflow: hidden;
        }

        .scroll-line::after {
            content: '';
            position: absolute;
            top: -100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: #c4a35a;
            animation: scrollDown 2s ease-in-out infinite;
        }

        @keyframes scrollDown {
            0% { top: -100%; }
            50% { top: 0; }
            100% { top: 100%; }
        }

        .next-section {
            min-height: 50vh;
            background: #fdfcfa;
            padding: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .next-section p {
            font-family: 'DM Serif Display', serif;
            font-size: 1.5rem;
            color: #999;
        }

        .da-label {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: #2c2418;
            color: #e8e0d4;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.7rem;
            letter-spacing: 2px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="da-label">DA 1 — SABLE & OR</div>

    <section class="hero">
        <canvas id="bg"></canvas>
        <div class="grain"></div>

        <header class="header">
            <div class="logo">S. Mostfa</div>
            <nav class="nav">
                <a href="#">Domaines</a>
                <a href="#">Cabinet</a>
                <a href="#">Honoraires</a>
                <a href="#">Contact</a>
            </nav>
        </header>

        <div class="hero-content">
            <p class="hero-eyebrow">Avocate au Barreau de Lyon</p>
            <h1 class="hero-title">
                Sarah <span class="italic">Mostfa.</span>
            </h1>
            <div class="hero-divider"></div>
            <p class="hero-description">
                Assure la défense de vos intérêts devant les juridictions <strong>civiles</strong> et <strong>commerciales</strong>.
            </p>
        </div>

        <div class="scroll-indicator">
            <span class="scroll-text">Défiler</span>
            <div class="scroll-line"></div>
        </div>
    </section>

    <section class="next-section">
        <p>— Section suivante : Domaines d'intervention —</p>
    </section>

    <script>
    (function() {
        const canvas = document.getElementById('bg');
        const ctx = canvas.getContext('2d');
        let w, h, mouse = { x: 0, y: 0 }, particles = [];

        const COLORS = [
            'rgba(196, 163, 90, 0.25)',
            'rgba(180, 140, 70, 0.15)',
            'rgba(210, 190, 150, 0.2)',
            'rgba(160, 120, 60, 0.1)',
            'rgba(220, 200, 170, 0.12)',
        ];

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            mouse.x = w / 2;
            mouse.y = h / 2;
        }

        function Particle() {
            this.x = Math.random() * w;
            this.y = Math.random() * h;
            this.size = 80 + Math.random() * 200;
            this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
            this.vx = (Math.random() - 0.5) * 0.3;
            this.vy = (Math.random() - 0.5) * 0.3;
            this.baseX = this.x;
            this.baseY = this.y;
        }

        Particle.prototype.update = function() {
            const dx = mouse.x - this.x;
            const dy = mouse.y - this.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const maxDist = 400;

            if (dist < maxDist) {
                const force = (maxDist - dist) / maxDist;
                this.x += dx * force * 0.02;
                this.y += dy * force * 0.02;
            }

            this.x += this.vx;
            this.y += this.vy;

            this.x += (this.baseX - this.x) * 0.005;
            this.y += (this.baseY - this.y) * 0.005;
        };

        Particle.prototype.draw = function() {
            const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
            gradient.addColorStop(0, this.color);
            gradient.addColorStop(1, 'transparent');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        };

        function init() {
            resize();
            particles = [];
            for (let i = 0; i < 15; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = '#e8e0d4';
            ctx.fillRect(0, 0, w, h);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('resize', () => { init(); });

        init();
        animate();
    })();
    </script>
</body>
</html>
