    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0ebe2; }

        .spacer {
            height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .spacer h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3rem; font-weight: 400; color: #2c2418; text-align: center;
        }
        .spacer p { text-align: center; color: #888; font-size: 0.9rem; margin-top: 15px; }

        .skyline-section {
            position: relative;
            width: 100%;
            overflow: hidden;
            background: #f0ebe2;
            padding: 0 0 10px;
        }

        .skyline-svg {
            display: block;
            width: 100%;
            height: auto;
            max-height: 220px;
        }

        .skyline-stroke {
            fill: none;
            stroke: #72785f;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .skyline-fill-path {
            fill: #72785f;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        .skyline-section.drawn .skyline-fill-path {
            opacity: 0.07;
        }

        /* Baseline */
        .skyline-base {
            stroke: #72785f;
            stroke-width: 1;
            opacity: 0.2;
        }

        .next-section {
            background: #1a1a1a;
            min-height: 60vh;
            display: flex; align-items: center; justify-content: center;
        }
        .next-section p { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; color: #555; }

        .label {
            position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
            background: #72785f; color: #fff; padding: 6px 18px;
            border-radius: 20px; font-size: 0.7rem; letter-spacing: 2px; z-index: 100;
        }
    </style>

    <script>
        const section = document.getElementById('skylineSection');
        const path = document.getElementById('skylinePath');
        const totalLength = path.getTotalLength();
        const spokes = document.getElementById('roueSpokes');
        const tower = document.getElementById('tourStructure');
        const crosses = document.getElementById('crosses');

        path.style.strokeDasharray = totalLength;
        path.style.strokeDashoffset = totalLength;

        // Also animate detail groups
        [spokes, tower, crosses].forEach(el => {
            el.style.transition = 'opacity 0.8s';
            el.style.opacity = '0';
        });

        window.addEventListener('scroll', () => {
            const rect = section.getBoundingClientRect();
            const windowH = window.innerHeight;
            const start = windowH;
            const end = -rect.height * 0.3;
            const progress = Math.max(0, Math.min(1, (start - rect.top) / (start - end)));

            path.style.strokeDashoffset = totalLength * (1 - progress);

            // Show details after certain progress
            if (progress > 0.35) {
                spokes.style.opacity = '0.5';
            }
            if (progress > 0.7) {
                tower.style.opacity = '0.5';
                crosses.style.opacity = '0.5';
            }

            if (progress > 0.9) {
                section.classList.add('drawn');
            } else {
                section.classList.remove('drawn');
            }
        });
