<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skyline Lyon — Option B (remplissage progressif)</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0ebe2;
        }

        .spacer {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        .spacer h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3rem;
            font-weight: 400;
            color: #2c2418;
            text-align: center;
        }
        .spacer p { text-align: center; color: #888; font-size: 0.9rem; margin-top: 15px; }

        .skyline-section {
            position: relative;
            width: 100%;
            overflow: hidden;
            background: #f0ebe2;
        }

        .skyline-svg {
            display: block;
            width: 100%;
            height: auto;
        }

        /* The skyline is revealed via a clip-path that expands left to right */
        .skyline-reveal {
            clip-path: inset(0 100% 0 0);
            transition: clip-path 0s linear;
        }

        .skyline-fill-shape {
            fill: #72785f;
            opacity: 0.1;
        }

        .skyline-stroke-shape {
            fill: none;
            stroke: #72785f;
            stroke-width: 2;
            opacity: 0.5;
        }

        /* Reflection */
        .skyline-reflection {
            transform: scaleY(-1) translateY(-10px);
            opacity: 0.03;
        }

        .next-section {
            background: #1a1a1a;
            min-height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .next-section p {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            color: #555;
        }

        .label {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: #72785f;
            color: #fff;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.7rem;
            letter-spacing: 2px;
            z-index: 100;
        }
    </style>
</head>

    <div class="next-section">
        <p>— Section suivante —</p>
    </div>

    <script>
        const section = document.getElementById('skylineSection');
        const reveal = document.getElementById('skylineReveal');

        window.addEventListener('scroll', () => {
            const rect = section.getBoundingClientRect();
            const windowH = window.innerHeight;
            const start = windowH;
            const end = -rect.height * 0.5;
            const progress = Math.max(0, Math.min(1, (start - rect.top) / (start - end)));

            // clip-path reveals left to right
            const clipRight = 100 - (progress * 100);
            reveal.style.clipPath = `inset(0 ${clipRight}% 0 0)`;
        });
    </script>
