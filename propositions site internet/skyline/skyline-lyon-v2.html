    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0ebe2; }
        .spacer {
            height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .spacer h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3rem; font-weight: 400; color: #2c2418; text-align: center;
        }
        .spacer p { text-align: center; color: #888; font-size: 0.9rem; margin-top: 15px; }

        .skyline-section {
            position: relative; width: 100%; overflow: hidden;
            background: #f0ebe2; padding: 0;
        }

        .skyline-svg { display: block; width: 100%; height: auto; }

        .skyline-stroke {
            fill: none;
            stroke: #72785f;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .skyline-fill-path {
            fill: #72785f;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        .skyline-section.drawn .skyline-fill-path { opacity: 0.08; }

        .skyline-detail {
            stroke: #72785f;
            fill: none;
            stroke-linecap: round;
        }

        .next-section {
            background: #1a1a1a; min-height: 60vh;
            display: flex; align-items: center; justify-content: center;
        }
        .next-section p { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; color: #555; }

        .label {
            position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
            background: #72785f; color: #fff; padding: 6px 18px;
            border-radius: 20px; font-size: 0.7rem; letter-spacing: 2px; z-index: 100;
        }
    </style>
</head>

                <line x1="1267" y1="198" x2="1267" y2="205" stroke="#72785f" stroke-width="0.7"/>
                <line x1="1264" y1="201" x2="1270" y2="201" stroke="#72785f" stroke-width="0.7"/>
                <!-- Windows row -->
                <line x1="1242" y1="230" x2="1266" y2="230" stroke="#72785f" stroke-width="0.4"/>
                <line x1="1244" y1="222" x2="1264" y2="222" stroke="#72785f" stroke-width="0.4"/>
                <!-- Arched entrance hint -->
                <path d="M1250,270 L1250,260 Q1254,255 1258,260 L1258,270" fill="none" stroke="#72785f" stroke-width="0.5"/>
            </g>

            <!-- Pont (bridge between Fourvière and city) -->
            <g id="detailPont" opacity="0">
                <!-- Bridge deck -->
                <line x1="720" y1="268" x2="820" y2="268" stroke="#72785f" stroke-width="1.2"/>
                <!-- Arches -->
                <path d="M725,268 Q742,255 760,268" fill="none" stroke="#72785f" stroke-width="0.8"/>
                <path d="M760,268 Q777,255 795,268" fill="none" stroke="#72785f" stroke-width="0.8"/>
                <path d="M795,268 Q807,258 820,268" fill="none" stroke="#72785f" stroke-width="0.8"/>
                <!-- Railings -->
                <line x1="725" y1="266" x2="820" y2="266" stroke="#72785f" stroke-width="0.3"/>
                <!-- Pillars -->
                <line x1="760" y1="268" x2="760" y2="275" stroke="#72785f" stroke-width="0.6"/>
                <line x1="795" y1="268" x2="795" y2="275" stroke="#72785f" stroke-width="0.6"/>
            </g>

            <!-- Water hint -->
            <g id="detailWater" opacity="0">
                <path d="M700,278 Q720,276 740,278 Q760,280 780,278 Q800,276 820,278 Q840,280 860,278" fill="none" stroke="#72785f" stroke-width="0.4" opacity="0.3"/>
            </g>

            <!-- Baseline -->
            <line x1="0" y1="270" x2="1400" y2="270" stroke="#72785f" stroke-width="0.5" opacity="0.15"/>

    </div>

    <div class="next-section">
        <p>— Section suivante —</p>
    </div>

    <script>
        const section = document.getElementById('skylineSection');
        const path = document.getElementById('skylinePath');
        const totalLength = path.getTotalLength();

        path.style.strokeDasharray = totalLength;
        path.style.strokeDashoffset = totalLength;

        const details = [
            { el: document.getElementById('detailCrayon'), at: 0.15 },
            { el: document.getElementById('detailIncity'), at: 0.22 },
            { el: document.getElementById('detailOxygene'), at: 0.28 },
            { el: document.getElementById('detailRoue'), at: 0.38 },
            { el: document.getElementById('detailPont'), at: 0.50 },
            { el: document.getElementById('detailWater'), at: 0.52 },
            { el: document.getElementById('detailTour'), at: 0.72 },
            { el: document.getElementById('detailFourviere'), at: 0.80 },
        ];

        details.forEach(d => {
            d.el.style.transition = 'opacity 0.8s ease';
        });

        window.addEventListener('scroll', () => {
            const rect = section.getBoundingClientRect();
            const windowH = window.innerHeight;
            const start = windowH;
            const end = -rect.height * 0.3;
            const progress = Math.max(0, Math.min(1, (start - rect.top) / (start - end)));

            path.style.strokeDashoffset = totalLength * (1 - progress);

            details.forEach(d => {
                d.el.style.opacity = progress > d.at ? '0.6' : '0';
            });

            section.classList.toggle('drawn', progress > 0.92);
        });
    </script>
</body>
</html>
