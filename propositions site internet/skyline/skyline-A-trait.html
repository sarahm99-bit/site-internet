<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skyline Lyon — Option A (trait continu)</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0ebe2;
        }

        .spacer {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .spacer h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3rem;
            font-weight: 400;
            color: #2c2418;
            text-align: center;
        }

        .spacer p {
            text-align: center;
            color: #888;
            font-size: 0.9rem;
            margin-top: 15px;
        }

        /* Skyline container */
        .skyline-section {
            position: relative;
            width: 100%;
            padding: 0;
            overflow: hidden;
            background: #f0ebe2;
        }

        .skyline-svg {
            display: block;
            width: 100%;
            height: auto;
        }

        /* The stroke-based skyline */
        .skyline-line {
            fill: none;
            stroke: #72785f;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 3000;
            stroke-dashoffset: 3000;
            transition: stroke-dashoffset 0s;
        }

        /* Fill that fades in after the line draws */
        .skyline-fill {
            fill: #72785f;
            opacity: 0;
            transition: opacity 1.2s ease 0.3s;
        }

        .skyline-section.drawn .skyline-fill {
            opacity: 0.06;
        }

        .next-section {
            background: #1a1a1a;
            min-height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .next-section p {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            color: #555;
        }

        .label {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: #72785f;
            color: #fff;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.7rem;
            letter-spacing: 2px;
            z-index: 100;
        }
    </style>
</head>

    <div class="next-section">
        <p>— Section suivante —</p>
    </div>

    <script>
        const section = document.getElementById('skylineSection');
        const path = document.getElementById('skylinePath');
        const totalLength = path.getTotalLength();

        path.style.strokeDasharray = totalLength;
        path.style.strokeDashoffset = totalLength;

        window.addEventListener('scroll', () => {
            const rect = section.getBoundingClientRect();
            const windowH = window.innerHeight;

            // Start drawing when section enters viewport, finish when it's fully visible
            const start = windowH;
            const end = -rect.height * 0.3;
            const progress = Math.max(0, Math.min(1, (start - rect.top) / (start - end)));

            path.style.strokeDashoffset = totalLength * (1 - progress);

            if (progress > 0.9) {
                section.classList.add('drawn');
            } else {
                section.classList.remove('drawn');
            }
        });
    </script>
